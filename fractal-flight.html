<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fractal Flight — Shadertoy Replica</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ease: cubic-bezier(0.32, 0.72, 0, 1);
    --hairline: rgba(255,255,255,.09);
    --accent: #7df9ff;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  canvas { display: block; width: 100%; height: 100%; }
  body { font-family: 'Space Grotesk', monospace; -webkit-font-smoothing: antialiased; }

  /* ---------- trigger pill ---------- */
  #btn-settings {
    position: fixed; top: 24px; right: 24px; z-index: 20;
    display: flex; align-items: center; gap: 10px;
    padding: 6px 6px 6px 20px;
    background: rgba(10,10,14,.55);
    border-radius: 999px; cursor: pointer;
    border: none; outline: none;
    box-shadow: inset 0 0 0 1px var(--hairline), inset 0 1px 1px rgba(255,255,255,.12);
    backdrop-filter: blur(24px) saturate(1.4);
    color: #f4f4f6; font-family: inherit; font-size: 12px;
    letter-spacing: .22em; text-transform: uppercase; font-weight: 500;
    transition: transform .7s var(--ease), box-shadow .7s var(--ease);
  }
  #btn-settings:hover { transform: scale(1.03); box-shadow: inset 0 0 0 1px rgba(125,249,255,.35), inset 0 1px 1px rgba(255,255,255,.15), 0 0 32px rgba(125,249,255,.12); }
  #btn-settings:active { transform: scale(.97); }
  #btn-settings .dot {
    width: 30px; height: 30px; border-radius: 50%;
    background: rgba(125,249,255,.1);
    box-shadow: inset 0 0 0 1px rgba(125,249,255,.25);
    display: grid; place-items: center; transition: transform .7s var(--ease);
  }
  #btn-settings:hover .dot { transform: rotate(90deg) scale(1.08); }
  #btn-settings svg { width: 13px; height: 13px; stroke: var(--accent); stroke-width: 1.25; fill: none; transition: transform .7s var(--ease); }
  body.panel-open #btn-settings .dot svg { transform: rotate(180deg); }

  /* ---------- panel shell (double bezel) ---------- */
  #panel-wrap {
    position: fixed; top: 82px; right: 24px; z-index: 19;
    width: 320px; max-width: calc(100vw - 48px);
    padding: 8px; border-radius: 28px;
    background: rgba(255,255,255,.04);
    box-shadow: inset 0 0 0 1px var(--hairline), 0 40px 80px -20px rgba(0,0,0,.8);
    opacity: 0; transform: translateY(-16px) scale(.96); pointer-events: none;
    transition: opacity .6s var(--ease), transform .7s var(--ease);
  }
  body.panel-open #panel-wrap { opacity: 1; transform: translateY(0) scale(1); pointer-events: auto; }

  #panel {
    border-radius: 21px;
    background: rgba(8,8,12,.72);
    backdrop-filter: blur(40px) saturate(1.5);
    box-shadow: inset 0 1px 1px rgba(255,255,255,.08);
    max-height: calc(100vh - 130px); overflow-y: auto;
    scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.15) transparent;
    padding: 28px 24px 24px; color: #cfcfd6;
  }
  .eyebrow {
    display: inline-block; padding: 5px 12px; margin-bottom: 18px;
    border-radius: 999px; font-size: 9px; font-weight: 500;
    letter-spacing: .3em; text-transform: uppercase; color: var(--accent);
    background: rgba(125,249,255,.06);
    box-shadow: inset 0 0 0 1px rgba(125,249,255,.18);
  }
  #panel h2 {
    font-size: 22px; font-weight: 300; letter-spacing: .06em;
    color: #fff; margin-bottom: 26px;
  }
  #panel h2 em { font-style: normal; color: rgba(255,255,255,.35); }

  /* staggered reveal */
  .reveal { opacity: 0; transform: translateY(14px); transition: opacity .6s var(--ease), transform .7s var(--ease); }
  body.panel-open .reveal { opacity: 1; transform: translateY(0); }
  body.panel-open .reveal:nth-child(1){transition-delay:.08s} body.panel-open .reveal:nth-child(2){transition-delay:.13s}
  body.panel-open .reveal:nth-child(3){transition-delay:.18s} body.panel-open .reveal:nth-child(4){transition-delay:.23s}
  body.panel-open .reveal:nth-child(5){transition-delay:.28s} body.panel-open .reveal:nth-child(6){transition-delay:.33s}
  body.panel-open .reveal:nth-child(7){transition-delay:.38s} body.panel-open .reveal:nth-child(8){transition-delay:.43s}
  body.panel-open .reveal:nth-child(9){transition-delay:.48s} body.panel-open .reveal:nth-child(10){transition-delay:.53s}
  body.panel-open .reveal:nth-child(11){transition-delay:.58s} body.panel-open .reveal:nth-child(12){transition-delay:.63s}

  /* section divider — label style instead of hr */
  .sec-label {
    margin: 26px 0 14px; display: flex; align-items: center; gap: 12px;
    font-size: 9px; letter-spacing: .3em; text-transform: uppercase; color: rgba(255,255,255,.35);
  }
  .sec-label::after { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, var(--hairline), transparent); }

  /* ---------- rows & sliders ---------- */
  .row { margin-bottom: 16px; }
  .row label {
    display: flex; justify-content: space-between; align-items: baseline;
    margin-bottom: 7px; font-size: 10px; letter-spacing: .18em;
    text-transform: uppercase; color: rgba(255,255,255,.45); font-weight: 500;
  }
  .row label span {
    font-size: 11px; letter-spacing: .04em; font-weight: 400;
    color: var(--accent); font-variant-numeric: tabular-nums;
    text-shadow: 0 0 12px rgba(125,249,255,.45);
  }
  input[type=range] {
    -webkit-appearance: none; appearance: none;
    width: 100%; height: 18px; background: transparent; cursor: pointer;
  }
  input[type=range]::-webkit-slider-runnable-track {
    height: 2px; border-radius: 2px;
    background: linear-gradient(90deg, var(--accent) 0%, var(--accent) var(--fill,50%), rgba(255,255,255,.12) var(--fill,50%));
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 13px; height: 13px; margin-top: -5.5px; border-radius: 50%;
    background: #0a0a0e;
    box-shadow: inset 0 0 0 1.5px var(--accent), 0 0 14px rgba(125,249,255,.5);
    transition: transform .4s var(--ease);
  }
  input[type=range]:hover::-webkit-slider-thumb { transform: scale(1.25); }
  input[type=range]:active::-webkit-slider-thumb { transform: scale(1.05); }
  input[type=range]::-moz-range-track { height: 2px; border-radius: 2px; background: rgba(255,255,255,.12); }
  input[type=range]::-moz-range-progress { height: 2px; border-radius: 2px; background: var(--accent); }
  input[type=range]::-moz-range-thumb {
    width: 13px; height: 13px; border-radius: 50%; border: none;
    background: #0a0a0e; box-shadow: inset 0 0 0 1.5px var(--accent), 0 0 14px rgba(125,249,255,.5);
  }

  /* ---------- presets ---------- */
  .preset-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .preset-grid button {
    padding: 11px 6px; font-family: inherit; font-size: 10px; font-weight: 500;
    letter-spacing: .16em; text-transform: uppercase; cursor: pointer;
    color: rgba(255,255,255,.65); background: rgba(255,255,255,.03);
    border: none; border-radius: 12px;
    box-shadow: inset 0 0 0 1px var(--hairline);
    transition: all .5s var(--ease);
  }
  .preset-grid button:hover {
    color: #fff; background: rgba(125,249,255,.07); transform: translateY(-1px);
    box-shadow: inset 0 0 0 1px rgba(125,249,255,.3), 0 8px 24px -8px rgba(125,249,255,.2);
  }
  .preset-grid button:active { transform: translateY(0) scale(.97); }

  #btn-reset {
    width: 100%; margin-top: 20px; padding: 13px;
    font-family: inherit; font-size: 10px; font-weight: 500;
    letter-spacing: .24em; text-transform: uppercase; cursor: pointer;
    color: rgba(255,255,255,.75); background: transparent;
    border: none; border-radius: 999px;
    box-shadow: inset 0 0 0 1px var(--hairline);
    transition: all .5s var(--ease);
  }
  #btn-reset:hover { color: #fff; background: rgba(255,255,255,.05); box-shadow: inset 0 0 0 1px rgba(255,255,255,.25); }
  #btn-reset:active { transform: scale(.98); }

  @media (max-width: 480px) {
    #btn-settings { top: 16px; right: 16px; }
    #panel-wrap { top: 68px; right: 12px; left: 12px; width: auto; }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>

<button id="btn-settings">
  Control
  <span class="dot">
    <svg viewBox="0 0 16 16"><path d="M2 5h12M2 8h8M2 11h4" stroke-linecap="round"/></svg>
  </span>
</button>

<div id="panel-wrap">
  <div id="panel">
    <div class="reveal"><span class="eyebrow">Live Parameters</span></div>
    <div class="reveal"><h2>Fractal<br><em>Control Deck</em></h2></div>

    <div class="row reveal"><label>Layers <span id="v-layers"></span></label><input type="range" id="p-layers" min="2" max="96" step="1" value="16"></div>
    <div class="row reveal"><label>Iterations <span id="v-iter"></span></label><input type="range" id="p-iter" min="4" max="40" step="1" value="23"></div>
    <div class="row reveal"><label>Speed <span id="v-speed"></span></label><input type="range" id="p-speed" min="0" max="1.5" step="0.01" value="0.30"></div>
    <div class="row reveal"><label>Zoom <span id="v-zoom"></span></label><input type="range" id="p-zoom" min="0.5" max="3" step="0.01" value="1.00"></div>
    <div class="row reveal"><label>Fade Start <span id="v-fade"></span></label><input type="range" id="p-fade" min="0.5" max="1.0" step="0.005" value="0.90"></div>
    <div class="row reveal"><label>Tint R <span id="v-tr"></span></label><input type="range" id="p-tr" min="0" max="4" step="0.05" value="2.00"></div>
    <div class="row reveal"><label>Tint G <span id="v-tg"></span></label><input type="range" id="p-tg" min="0" max="4" step="0.05" value="1.00"></div>
    <div class="row reveal"><label>Tint B <span id="v-tb"></span></label><input type="range" id="p-tb" min="0" max="4" step="0.05" value="2.00"></div>
    <div class="row reveal"><label>Gamma <span id="v-gamma"></span></label><input type="range" id="p-gamma" min="0.3" max="1.2" step="0.01" value="0.50"></div>

    <div class="sec-label reveal">Presets</div>
    <div class="preset-grid reveal">
      <button data-preset="original">Original</button>
      <button data-preset="deep">Deep Dive</button>
      <button data-preset="ice">Ice</button>
      <button data-preset="ember">Ember</button>
      <button data-preset="ghost">Ghost</button>
      <button data-preset="hyper">Hyper</button>
    </div>

    <button id="btn-reset" class="reveal">Reset to Original</button>
  </div>
</div>

<script>
const vs = `attribute vec2 p; void main(){ gl_Position = vec4(p,0.,1.); }`;
const fs = `
precision highp float;
uniform vec2 iResolution;
uniform float iTime;
uniform float uLayers, uIter, uSpeed, uZoom, uFade;
uniform vec3 uTint;
uniform float uGamma;

vec4 tex(vec3 p)
{
    float t = iTime + 78.0;
    vec4 o = vec4(p.xyz, 3.0*sin(t*.1));
    vec4 dec = vec4(1.,.9,.1,.15) + vec4(.06*cos(t*.1), 0., 0., .14*cos(t*.23));
    for (int i = 0; i < 64; i++) {
        if (float(i) >= uIter) break;
        o.xzyw = abs(o/dot(o,o) - dec);
    }
    return o;
}

void main()
{
    vec2 uv = (gl_FragCoord.xy - iResolution.xy*.5)/iResolution.y * uZoom;
    vec3 col = vec3(0.);
    float t = iTime * uSpeed;

    for (int i = 0; i < 128; i++) {
        if (float(i) > uLayers) break;
        float fi = float(i)/uLayers;
        float d = fract(fi + t);
        float s = mix(5., .5, d);
        float f = d * smoothstep(1., uFade, d);
        col += tex(vec3(uv*s, fi*4.)).xyz * f;
    }

    col /= uLayers;
    col *= uTint;
    col = pow(col, vec3(uGamma));
    gl_FragColor = vec4(col, 1.0);
}`;

const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl');

function compile(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(s));
  return s;
}
const prog = gl.createProgram();
gl.attachShader(prog, compile(gl.VERTEX_SHADER, vs));
gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, fs));
gl.linkProgram(prog);
gl.useProgram(prog);

const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
const locP = gl.getAttribLocation(prog, 'p');
gl.enableVertexAttribArray(locP);
gl.vertexAttribPointer(locP, 2, gl.FLOAT, false, 0, 0);

const U = {};
['iResolution','iTime','uLayers','uIter','uSpeed','uZoom','uFade','uTint','uGamma'].forEach(n => U[n] = gl.getUniformLocation(prog, n));

const params = { layers: 16, iter: 23, speed: 0.30, zoom: 1.00, fade: 0.90, tr: 2.00, tg: 1.00, tb: 2.00, gamma: 0.50 };

const presets = {
  original: { layers:16, iter:23, speed:.30, zoom:1.0, fade:.90, tr:2, tg:1, tb:2, gamma:.50 },
  deep:     { layers:48, iter:28, speed:.18, zoom:.7, fade:.95, tr:.8, tg:1.2, tb:2.6, gamma:.45 },
  ice:      { layers:24, iter:23, speed:.22, zoom:1.0, fade:.92, tr:1.0, tg:1.8, tb:3.0, gamma:.55 },
  ember:    { layers:32, iter:26, speed:.35, zoom:1.1, fade:.88, tr:3.2, tg:1.1, tb:.4, gamma:.50 },
  ghost:    { layers:16, iter:23, speed:.12, zoom:1.0, fade:.90, tr:1.4, tg:1.4, tb:1.5, gamma:.65 },
  hyper:    { layers:80, iter:32, speed:.60, zoom:.9, fade:.94, tr:2, tg:1, tb:2, gamma:.42 },
};

function paintFill(el) {
  const min = +el.min, max = +el.max;
  el.style.setProperty('--fill', ((el.value - min) / (max - min) * 100) + '%');
}

function applyParams() {
  document.querySelectorAll('input[type=range]').forEach(paintFill);
  document.getElementById('v-layers').textContent = params.layers;
  document.getElementById('v-iter').textContent = params.iter;
  document.getElementById('v-speed').textContent = params.speed.toFixed(2);
  document.getElementById('v-zoom').textContent = params.zoom.toFixed(2);
  document.getElementById('v-fade').textContent = params.fade.toFixed(3);
  document.getElementById('v-tr').textContent = params.tr.toFixed(2);
  document.getElementById('v-tg').textContent = params.tg.toFixed(2);
  document.getElementById('v-tb').textContent = params.tb.toFixed(2);
  document.getElementById('v-gamma').textContent = params.gamma.toFixed(2);
}
applyParams();

const bindings = [
  ['p-layers','layers',parseInt], ['p-iter','iter',parseInt], ['p-speed','speed',parseFloat],
  ['p-zoom','zoom',parseFloat], ['p-fade','fade',parseFloat], ['p-tr','tr',parseFloat],
  ['p-tg','tg',parseFloat], ['p-tb','tb',parseFloat], ['p-gamma','gamma',parseFloat],
];
bindings.forEach(([id,key,cast]) => {
  const el = document.getElementById(id);
  el.value = params[key];
  el.addEventListener('input', () => { paintFill(el); params[key] = cast(el.value); applyParams(); });
});

document.querySelectorAll('.preset-grid button').forEach(b => {
  b.addEventListener('click', () => {
    Object.assign(params, presets[b.dataset.preset]);
    bindings.forEach(([id,key]) => document.getElementById(id).value = params[key]);
    applyParams();
  });
});
document.getElementById('btn-reset').addEventListener('click', () => {
  Object.assign(params, presets.original);
  bindings.forEach(([id,key]) => document.getElementById(id).value = params[key]);
  applyParams();
});

const btn = document.getElementById('btn-settings');
const panel = document.getElementById('panel');
btn.addEventListener('click', () => document.body.classList.toggle('panel-open'));
document.addEventListener('keydown', e => { if (e.key === 'Escape') document.body.classList.remove('panel-open'); });

function resize() {
  canvas.width = innerWidth * devicePixelRatio;
  canvas.height = innerHeight * devicePixelRatio;
  gl.viewport(0, 0, canvas.width, canvas.height);
}
addEventListener('resize', resize);
resize();

const start = performance.now();
function frame() {
  gl.uniform2f(U.iResolution, canvas.width, canvas.height);
  gl.uniform1f(U.iTime, (performance.now() - start) / 1000);
  gl.uniform1f(U.uLayers, Math.floor(params.layers));
  gl.uniform1f(U.uIter, Math.floor(params.iter));
  gl.uniform1f(U.uSpeed, params.speed);
  gl.uniform1f(U.uZoom, params.zoom);
  gl.uniform1f(U.uFade, params.fade);
  gl.uniform3f(U.uTint, params.tr, params.tg, params.tb);
  gl.uniform1f(U.uGamma, params.gamma);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  requestAnimationFrame(frame);
}
frame();
</script>
</body>
</html>
